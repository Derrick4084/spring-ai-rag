spring:
  application:
    name: rag
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5332/rag
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    database: postgresql
    show-sql: true
  ai:
    mcp:
      client:
        enabled: true
        name: rag-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        streamable-http:
          connections:
            server1:
              url: http://localhost:8075
              endpoint: /api/mcp
#            server2:
#              url: http://otherserver:8081
#              endpoint: /custom-sse
    openai:
      api-key: none
      timeout: 5m
      chat:
        base-url: http://10.0.0.44:8080/v1
        options:
          model: llama31
      embedding:
        base-url: http://10.0.0.44:8081/v1
        options:
          model: nomic-embed

#  ai:
#    ollama:
#      chat:
#        options:
#          model: llama3.2:latest
#      embedding:
#        options:
#          model: nomic-embed-text:latest



    vectorstore:
      qdrant:
        initialize-schema: true
        host: localhost
        port: 6334
        collection-name: docs_random_llama3.2


logging:
  level:
