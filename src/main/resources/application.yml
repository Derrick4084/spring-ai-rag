spring:
  profiles:
    active: remote
  application:
    name: rag
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/rag
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    database: postgresql
    show-sql: true
  ai:
    client:
      enabled: false
    mcp:
      client:
        enabled: true
        name: rag-client
        version: 1.0.0
        request-timeout: 30s
        type: SYNC
        streamable-http:
          connections:
            server1:
              url: http://localhost:8075
              endpoint: /api/mcp
    vectorstore:
      qdrant:
        initialize-schema: false
        host: localhost
        port: 6334
        collection-name: docs_random_llama3.2


