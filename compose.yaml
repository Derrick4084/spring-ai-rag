services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
  ollama:
    image: ollama:local
    container_name: ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 3
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
volumes:
  qdrant_data:
  ollama_data: